# Settings read at run time by ml/config.py. The conformal fit scripts use
# [conformal] alpha as the default for --alpha; run_ablation.py always uses
# it, and the app uses it as the About page's default alpha and falls
# back to it when a threshold file or an inference result does not record
# alpha.

[conformal]
# Target miscoverage for the split-conformal step, written as an exact
# fraction so no decimal rounding can change the threshold rank. With six
# calibration rows a finite threshold cannot target more than 6/7 coverage
# (a smaller alpha gives an infinite one), so the demo targets alpha = 1/7.
alpha = "1/7"
