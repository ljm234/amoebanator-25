# Streamlit configuration.
# All keys verified against Streamlit 1.52.

[server]
# Hot-reload off - HF free-tier inotify watches consume CPU we need
# for inference; we don't edit the Space at runtime.
runOnSave = false
fileWatcherType = "none"
# Port matches this repo's Dockerfile (EXPOSE 8501, --server.port=8501)
# and app_port: 8501 in the README front matter. NOT 7860 (the Gradio
# default and the Spaces default app_port).
port = 8501

[global]
developmentMode = false

[client]
# Keep the sidebar page nav on (true is the Streamlit default). This
# does not expand the sidebar on narrow viewports: with the default
# initial_sidebar_state "auto" it starts collapsed there, and readers
# on a phone open it to reach all 4 pages.
showSidebarNavigation = true

[theme]
# Neutral-medical palette: clinical-adjacent demo, NOT branded.
# Material Design 900 family - harmonizes with the WCAG-AA wash+border
# colors in app/disclaimer.py _INJECTED_CSS.
primaryColor = "#0D47A1"            # Material Blue 900
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#212121"               # dark slate

[browser]
# Send no usage statistics to Streamlit (the default is true).
gatherUsageStats = false
